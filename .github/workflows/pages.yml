name: Documentation site

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export the Mintlify site
        working-directory: docs
        run: |
          npx --yes mint@4.2.879 export --output "$RUNNER_TEMP/site.zip"
          unzip -q "$RUNNER_TEMP/site.zip" -d "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exported site
        id: deployment
        uses: actions/deploy-pages@v5
