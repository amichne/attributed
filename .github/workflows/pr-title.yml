name: Pull request title

# Squash merges use the pull request title as the commit that release-please
# reads, so it must be a Conventional Commit. Runs again when the title changes.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  pr-title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title release-please will read
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Use a Conventional Commit title, such as 'feat: add signed notes' or 'fix(hooks): keep the bin/ link'."
            exit 1
          fi
