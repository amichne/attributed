name: Release

# release-please keeps a release pull request open with the next version and
# CHANGELOG.md, computed from Conventional Commit titles on main. Merging it
# tags the release and creates the GitHub release; GoReleaser then builds,
# uploads, and attests the archives and commits the cask to amichne/homebrew-tap.

on:
  push:
    branches:
      - main
  # Publishes an existing draft release, for a run whose publish job did not finish.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pushes made with GITHUB_TOKEN start no workflows, but a dispatch does,
      # and its checks attach to the release pull request's head commit.
      - name: Run CI on the release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<<"$PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  publish:
    name: Publish ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Require the tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::Set HOMEBREW_TAP_DEPLOY_KEY to the private half of a write deploy key on amichne/homebrew-tap, then re-run this job."
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 -timeout=15m ./...

      - name: Build, upload, and update the tap
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
