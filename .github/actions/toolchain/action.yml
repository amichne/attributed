name: Provision pinned tools
description: >-
  Fetch the checksum-pinned tools in tools/toolchain/toolchain.json and expose
  them to later steps. Adapted from amichne/slopsentral .github/actions/toolchain.
inputs:
  profile:
    description: Toolchain profile, core or ci.
    default: core
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        python3 tools/toolchain/toolchain.py fetch --profile "$PROFILE"
        python3 tools/toolchain/toolchain.py env --profile "$PROFILE" >> "$GITHUB_ENV"
        python3 tools/toolchain/toolchain.py paths --profile "$PROFILE" >> "$GITHUB_PATH"
